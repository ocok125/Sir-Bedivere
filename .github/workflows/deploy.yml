name: Deploy Website

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Project
        run: pnpm build --filter client... || pnpm build

      - name: Find and Prepare Dist Folder
        run: |
          # 自動尋找打包出來的 index.html 到底在哪個資料夾
          TARGET_DIR=$(find . -name "index.html" -not -path "*/node_modules/*" -not -path "*/client/src/*" | head -n 1 | xargs dirname)
          echo "Found index.html in: $TARGET_DIR"
          
          # 如果在子目錄，就把它複製到根目錄的 deploy_dist
          mkdir -p deploy_dist
          cp -r $TARGET_DIR/* deploy_dist/

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: deploy_dist  # 部署我們自動抓取出來的資料夾
          branch: gh-pages
